name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Limits stand at about twice the healthy time: a slower runner cancelled jobs at 30 minutes and hid red rows.
  node:
    name: Node suites
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show the runner
        run: nproc && free -m

      - name: Run the Node suites
        run: npx vitest run --project app --project replay-core --project ui

  # The engine suite runs twice: speed layer forced off (the kill switch) and forced on (a break throws).
  engine-speed-layer:
    name: Engine suite, speed layer ${{ matrix.speed-layer }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - speed-layer: forced off
            sim-fast: '0'
          - speed-layer: forced on
            sim-fast: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the engine suite
        run: npx vitest run --project eval-engine
        env:
          EVAL_SIM_FAST: ${{ matrix.sim-fast }}

  # Plays every move of the Dex (DICE_SWEEPS=full); the other jobs play a fixed sample.
  dice-sweeps:
    name: Dice sweeps, every move
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the dice sweeps
        run: npx vitest run --project eval-engine packages/eval-engine/test/dice-
        env:
          DICE_SWEEPS: full

  full-sweeps:
    name: Full sweeps, the other specs, part ${{ matrix.part }} of 3
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: 1
            files: >-
              packages/eval-engine/test/board-key-effects.spec.ts
              packages/eval-engine/test/board-key-predicate.spec.ts
              packages/eval-engine/test/delay-facts-sweep.spec.ts
              packages/eval-engine/test/flip-turn-recorder.spec.ts
              packages/eval-engine/test/flip-turn-sweep.spec.ts
              packages/eval-engine/test/forced-answers.spec.ts
              packages/eval-engine/test/forced-win-strike-sweep.spec.ts
              packages/eval-engine/test/new-game-unknown-names.spec.ts
              packages/eval-engine/test/plain-dice-sweep.spec.ts
              packages/eval-engine/test/plain-repeated-die-sweep.spec.ts
              packages/eval-engine/test/scripted-dice-parity.spec.ts
              packages/eval-engine/test/secondary-classes-paths.spec.ts
              packages/eval-engine/test/stand-in-priority-sweep.spec.ts
              packages/eval-engine/test/unlogged-choice-sweep.spec.ts
              packages/replay-core/test/blocked-effects-sweep-2.spec.ts
              packages/replay-core/test/landed-hit-sweep-2.spec.ts
              packages/replay-core/test/landed-hit-sweep.spec.ts
              packages/replay-core/test/screen-evidence.spec.ts
          - part: 2
            files: >-
              packages/eval-engine/test/board-facts.spec.ts
              packages/eval-engine/test/board-key-readers.spec.ts
              packages/eval-engine/test/forced-win-delay-sweep.spec.ts
              packages/eval-engine/test/hidden-aim.spec.ts
              packages/eval-engine/test/likeliest-dice-sweep.spec.ts
              packages/eval-engine/test/low-pp-sweep.spec.ts
              packages/eval-engine/test/new-game-ability-fill.spec.ts
              packages/eval-engine/test/new-game-blank-ability.spec.ts
              packages/eval-engine/test/new-game-formats.spec.ts
              packages/eval-engine/test/prover-helping-secondary-sweep.spec.ts
              packages/eval-engine/test/relayed-move-choice.spec.ts
              packages/eval-engine/test/secondary-classes.spec.ts
              packages/eval-engine/test/secondary-records.spec.ts
              packages/eval-engine/test/stratified-root-sweep.spec.ts
              packages/replay-core/test/blocked-effects-sweep.spec.ts
              packages/replay-core/test/field-evidence-sweep.spec.ts
              packages/replay-core/test/landed-hit-sweep-3.spec.ts
          - part: 3
            files: >-
              packages/eval-engine/test/board-key-census.spec.ts
              packages/eval-engine/test/switch-out-sweep.spec.ts
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show the runner
        run: nproc && free -m

      - name: Run the sweep specs of part ${{ matrix.part }}
        run: npx vitest run $SPECS
        env:
          DICE_SWEEPS: full
          SPECS: ${{ matrix.files }}

  browser:
    name: Browser flows, part ${{ matrix.part }} of 3
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: 1
            files: >-
              test/e2e/bench-bring.spec.ts
              test/e2e/branch-dice-flinch.spec.ts
              test/e2e/branch-dice-hits.spec.ts
              test/e2e/branch-dice-lines.spec.ts
              test/e2e/embed.spec.ts
              test/e2e/game-review.spec.ts
              test/e2e/matrix-dialog.spec.ts
              test/e2e/new-game-share.spec.ts
              test/e2e/play-out-finish.spec.ts
              test/e2e/replay-end.spec.ts
              test/e2e/repro-state.spec.ts
              test/e2e/stand-ins.spec.ts
              test/e2e/sweet-spot.spec.ts
              test/e2e/timeline-bar.spec.ts
              test/e2e/timeline.spec.ts
              test/e2e/turn-dock-vgc.spec.ts
          - part: 2
            files: >-
              test/e2e/branch-dice-pivot.spec.ts
              test/e2e/dock-narrow.spec.ts
              test/e2e/eval-graph.spec.ts
              test/e2e/eval.spec.ts
              test/e2e/frame-controls.spec.ts
              test/e2e/lead-dock.spec.ts
              test/e2e/loader.spec.ts
              test/e2e/new-game.spec.ts
              test/e2e/phone.spec.ts
              test/e2e/replacement-note.spec.ts
              test/e2e/scale.spec.ts
              test/e2e/topbar.spec.ts
              test/e2e/turn-dock-fill.spec.ts
              test/e2e/win-paths.spec.ts
          - part: 3
            files: >-
              test/e2e/branch.spec.ts
              test/e2e/dock-column.spec.ts
              test/e2e/engines.spec.ts
              test/e2e/eval-header.spec.ts
              test/e2e/hard-mode.spec.ts
              test/e2e/lines-play.spec.ts
              test/e2e/pickers.spec.ts
              test/e2e/replay-sprites.spec.ts
              test/e2e/right-column.spec.ts
              test/e2e/support.spec.ts
              test/e2e/teambuilder-table.spec.ts
              test/e2e/turn-dock-forced.spec.ts
              test/e2e/turn-dock.spec.ts
              test/e2e/turn-link.spec.ts
              test/e2e/variation-interlude.spec.ts
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Show the runner
        run: nproc && free -m

      # Two workers, half of the 4 vCPUs: three ran slower and turned a live-search row red.
      - name: Run the browser flows of part ${{ matrix.part }}
        run: npm run test:e2e -- --reporter=dot,json $SPECS
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/playwright-report.json
          SPECS: ${{ matrix.files }}

      - name: List the slowest browser specs and tests
        if: always()
        run: test -f playwright-report.json && node scripts/merge-playwright-reports.mjs playwright-report.json || true

      - name: Keep the JSON report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-part-${{ matrix.part }}
          path: playwright-report.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Keep the failure traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-part-${{ matrix.part }}
          path: test-results
          retention-days: 7

  # The required check: passes only when the matrix result is "success"; prints the wall time of each part.
  browser-flows:
    name: Browser flows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: browser
    if: always()
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Fetch the reports of the three parts
        uses: actions/download-artifact@v4
        if: always()
        with:
          pattern: playwright-report-part-*
          path: part-reports

      - name: Merge the reports and list the wall time of each part and the slowest specs and tests
        if: always()
        run: |
          shopt -s nullglob
          reports=(part-reports/playwright-report-part-*/playwright-report.json)
          echo "${#reports[@]} of 3 part reports found"
          if [ "${#reports[@]}" -gt 0 ]; then node scripts/merge-playwright-reports.mjs --out playwright-report.json "${reports[@]}"; fi

      - name: Keep the merged JSON report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail unless all three parts passed
        env:
          PARTS: ${{ needs.browser.result }}
        run: |
          echo "The parts' result: $PARTS"
          test "$PARTS" = success

  build:
    name: Production build smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for unused code
        run: npm run knip

      - name: Lint
        run: npm run lint

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # A pack that breaks (an import without its extension, a missing export) fails this job.
      - name: Pack the packages and run the consumer smoke
        run: npm run pack:smoke

      # The minified bundle with the speed layer off and on: same analysis, every worker reports active.
      - name: Run the build smoke
        run: npm run test:build

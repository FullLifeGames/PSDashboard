name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The four Vitest projects: the root specs, each package's suite, and the app suite under ui/.
      - name: Run the Node suites
        run: npm run test:regression

  browser:
    name: Browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the browser flows
        run: npm run test:e2e

      - name: Keep the failure traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

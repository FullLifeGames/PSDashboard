name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The four Vitest projects: the root specs, each package's suite, and the app suite under ui/.
      - name: Run the Node suites
        run: npm run test:regression

      # Round 59: the engine suite once more with the speed layer switched the other way
      # (forced on until the gate adopts it, forced off afterwards), so both paths stay green.
      - name: Run the engine suite with the speed layer forced on
        run: npx vitest run --project eval-engine
        env:
          EVAL_SIM_FAST: '1'

  browser:
    name: Browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the browser flows
        run: npm run test:e2e

      - name: Keep the failure traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

  build:
    name: Production build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The minified bundle with the speed layer off and on: same analysis, every worker reports active.
      - name: Run the build smoke
        run: npm run test:build

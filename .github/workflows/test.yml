name: Tests

on:
  push:
    branches: [master, main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The four Vitest projects: the root specs, each package's suite, and the app suite under test/ui/.
      - name: Run the Node suites
        run: npm run test:regression

  # Round 59: the Node suites cover the adopted speed layer; one more run forces it off (the kill
  # switch) and one forces it on (a break throws instead of falling back). Release 1.0.0: both ran
  # after the Node suites in one job, which outgrew its 20 minutes, so each runs as its own job.
  engine-speed-layer:
    name: Engine suite, speed layer ${{ matrix.speed-layer }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - speed-layer: forced off
            sim-fast: '0'
          - speed-layer: forced on
            sim-fast: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the engine suite
        run: npx vitest run --project eval-engine
        env:
          EVAL_SIM_FAST: ${{ matrix.sim-fast }}

  browser:
    name: Browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the browser flows
        run: npm run test:e2e

      - name: Keep the failure traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

  build:
    name: Production build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The minified bundle with the speed layer off and on: same analysis, every worker reports active.
      - name: Run the build smoke
        run: npm run test:build

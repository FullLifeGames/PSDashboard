name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job limits (round 89, step M4). Measured on 13.11.2026 on a 4-vCPU runner (the repository is public): healthy
  # Node suites 22 to 28 min (34 on a slow runner), Browser flows 21 to 24 min, engine suite 14 to 35 min (the same job ran 1.8 times
  # slower on a slower runner), dice sweeps 12 to 24 min, build smoke 1 min; setup (checkout, Node, npm ci,
  # Chromium) takes under one minute in every job. A runner that is 1.6 times slower cancelled Node suites and
  # Browser flows at 30 min and hid their red rows, so the limits stand at about twice the healthy time.
  node:
    name: Node suites
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show the runner
        run: nproc && free -m

      # Round 90 (F8): the app (root specs), replay-core and ui projects. The engine project runs in the two jobs below, once with the
      # speed layer forced off and once forced on; the default mode reads the same levers as forced on and only steps back quietly where forced on throws.
      - name: Run the Node suites
        run: npx vitest run --project app --project replay-core --project ui

  # Round 59: the engine suite runs once with the speed layer forced off (the kill switch) and once forced on (a break throws instead
  # of falling back). Release 1.0.0: both ran after the Node suites in one job, which outgrew its 20 minutes, so each runs as its own job.
  # Round 90 (F8): they are the only runs of the engine project (Node suites left it out).
  # Round 78: on simulator 0.10.12 the forced-off pass ran past 20 minutes (12 on 0.10.11), the
  # forced-on pass still takes 12.
  engine-speed-layer:
    name: Engine suite, speed layer ${{ matrix.speed-layer }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - speed-layer: forced off
            sim-fast: '0'
          - speed-layer: forced on
            sim-fast: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the engine suite
        run: npx vitest run --project eval-engine
        env:
          EVAL_SIM_FAST: ${{ matrix.sim-fast }}

  # Round 82 (forced dice): the dice sweeps play every move of the Dex only with DICE_SWEEPS=full; the jobs above play a
  # fixed sample of them. One full run per push, beside the other jobs (user gate 31.10.2026, "1b").
  dice-sweeps:
    name: Dice sweeps, every move
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the dice sweeps
        run: npx vitest run --project eval-engine packages/eval-engine/test/dice-
        env:
          DICE_SWEEPS: full

  # Round 89 (final gate, D6b): the dice job above reaches the `dice-*` files only, and 36 other spec files read the same switch. The three
  # parts below run them with DICE_SWEEPS=full. Their size comes from the run of 17.11.2026 (CI-1, the first run of the job): parts 1 and 2 hold
  # about 3,448 summed seconds of file time each (runner measure, 2.6 summed seconds per wall second, so about 22 min), part 3 holds
  # `board-key-census.spec.ts` alone, which played every move against every entry (a few million hits, over an hour) and now plays a bounded set (see its header). The longest
  # single files are landed-hit-sweep (675 s) and stratified-root-sweep (650 s). Required since round 90 (user 23.11.2026): the three parts are checks of their own, so branch protection lists
  # "Full sweeps, the other specs, part 1 of 3", "part 2 of 3" and "part 3 of 3" (workflows.spec.ts holds the nine contexts). `workflows.spec.ts` fails when a spec reads the switch and sits in neither job, or when a listed file is gone: add a new
  # sweep spec to the part with the least time, and keep every part under 25 minutes of wall time.
  full-sweeps:
    name: Full sweeps, the other specs, part ${{ matrix.part }} of 3
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: 1
            files: >-
              packages/eval-engine/test/board-key-effects.spec.ts
              packages/eval-engine/test/board-key-predicate.spec.ts
              packages/eval-engine/test/delay-facts-sweep.spec.ts
              packages/eval-engine/test/flip-turn-recorder.spec.ts
              packages/eval-engine/test/flip-turn-sweep.spec.ts
              packages/eval-engine/test/forced-answers.spec.ts
              packages/eval-engine/test/forced-win-strike-sweep.spec.ts
              packages/eval-engine/test/new-game-unknown-names.spec.ts
              packages/eval-engine/test/plain-dice-sweep.spec.ts
              packages/eval-engine/test/plain-repeated-die-sweep.spec.ts
              packages/eval-engine/test/scripted-dice-parity.spec.ts
              packages/eval-engine/test/secondary-classes-paths.spec.ts
              packages/eval-engine/test/stand-in-priority-sweep.spec.ts
              packages/eval-engine/test/unlogged-choice-sweep.spec.ts
              packages/replay-core/test/blocked-effects-sweep-2.spec.ts
              packages/replay-core/test/landed-hit-sweep-2.spec.ts
              packages/replay-core/test/landed-hit-sweep.spec.ts
              packages/replay-core/test/screen-evidence.spec.ts
          - part: 2
            files: >-
              packages/eval-engine/test/board-facts.spec.ts
              packages/eval-engine/test/board-key-readers.spec.ts
              packages/eval-engine/test/forced-win-delay-sweep.spec.ts
              packages/eval-engine/test/hidden-aim.spec.ts
              packages/eval-engine/test/likeliest-dice-sweep.spec.ts
              packages/eval-engine/test/low-pp-sweep.spec.ts
              packages/eval-engine/test/new-game-ability-fill.spec.ts
              packages/eval-engine/test/new-game-blank-ability.spec.ts
              packages/eval-engine/test/new-game-formats.spec.ts
              packages/eval-engine/test/prover-helping-secondary-sweep.spec.ts
              packages/eval-engine/test/relayed-move-choice.spec.ts
              packages/eval-engine/test/secondary-classes.spec.ts
              packages/eval-engine/test/secondary-records.spec.ts
              packages/eval-engine/test/stratified-root-sweep.spec.ts
              packages/replay-core/test/blocked-effects-sweep.spec.ts
              packages/replay-core/test/field-evidence-sweep.spec.ts
              packages/replay-core/test/landed-hit-sweep-3.spec.ts
          - part: 3
            files: >-
              packages/eval-engine/test/board-key-census.spec.ts
              packages/eval-engine/test/switch-out-sweep.spec.ts
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show the runner
        run: nproc && free -m

      - name: Run the sweep specs of part ${{ matrix.part }}
        run: npx vitest run $SPECS
        env:
          DICE_SWEEPS: full
          SPECS: ${{ matrix.files }}

  # Round 90 (step E6, #222): the browser flows run in three parts side by side, and the job "Browser flows" (key `browser-flows`)
  # after them stays the one required check, so branch protection needs no change. One job took 33.9 minutes on 22.11.2026 (49 of
  # its 50 on a slow runner). The lists balance the seconds of the Playwright report of r90-e (run 45078312352 at E3, play-out-finish cut from 496 to an estimated 390 seconds by E4), summed
  # over the two workers of a part: about 996, 997 and 1000 seconds, so about 8 minutes of wall time each (two workers) plus a
  # minute of setup. The browser-flows-parts rows of the workflows regression spec hold every file of test/e2e/ in exactly one part: a new file goes
  # into the part with the least seconds, and a part stays under 30 minutes. The files go to Playwright as path filters
  # (regular expressions on the path); the same spec holds each entry to one file.
  browser:
    name: Browser flows, part ${{ matrix.part }} of 3
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: 1
            files: >-
              test/e2e/bench-bring.spec.ts
              test/e2e/branch-dice-flinch.spec.ts
              test/e2e/branch-dice-hits.spec.ts
              test/e2e/branch-dice-lines.spec.ts
              test/e2e/embed.spec.ts
              test/e2e/game-review.spec.ts
              test/e2e/matrix-dialog.spec.ts
              test/e2e/new-game-share.spec.ts
              test/e2e/play-out-finish.spec.ts
              test/e2e/replay-end.spec.ts
              test/e2e/repro-state.spec.ts
              test/e2e/stand-ins.spec.ts
              test/e2e/sweet-spot.spec.ts
              test/e2e/timeline-bar.spec.ts
              test/e2e/timeline.spec.ts
              test/e2e/turn-dock-vgc.spec.ts
              test/e2e/zoom-probe.spec.ts
          - part: 2
            files: >-
              test/e2e/branch-dice-pivot.spec.ts
              test/e2e/dock-narrow.spec.ts
              test/e2e/eval-graph.spec.ts
              test/e2e/eval.spec.ts
              test/e2e/frame-controls.spec.ts
              test/e2e/lead-dock.spec.ts
              test/e2e/loader.spec.ts
              test/e2e/new-game.spec.ts
              test/e2e/phone.spec.ts
              test/e2e/replacement-note.spec.ts
              test/e2e/scale.spec.ts
              test/e2e/topbar.spec.ts
              test/e2e/turn-dock-fill.spec.ts
              test/e2e/win-paths.spec.ts
          - part: 3
            files: >-
              test/e2e/branch.spec.ts
              test/e2e/dock-column.spec.ts
              test/e2e/engines.spec.ts
              test/e2e/eval-header.spec.ts
              test/e2e/hard-mode.spec.ts
              test/e2e/lines-play.spec.ts
              test/e2e/pickers.spec.ts
              test/e2e/replay-sprites.spec.ts
              test/e2e/right-column.spec.ts
              test/e2e/support.spec.ts
              test/e2e/teambuilder-table.spec.ts
              test/e2e/turn-dock-forced.spec.ts
              test/e2e/turn-dock.spec.ts
              test/e2e/turn-link.spec.ts
              test/e2e/variation-interlude.spec.ts
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Show the runner
        run: nproc && free -m

      # Playwright runs 2 workers here (half of the 4 vCPUs). Tried on 13.11.2026: 3 workers took 28 min instead
      # of 21 to 24 and turned play-out-finish.spec.ts:65 red (its 10 s predicate); Vitest with --maxWorkers=100%
      # (4 workers instead of 3) took 34 min instead of 28 on Node suites. More workers did not
      # make a run faster. The JSON report feeds the next steps.
      - name: Run the browser flows of part ${{ matrix.part }}
        run: npm run test:e2e -- --reporter=dot,json $SPECS
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/playwright-report.json
          SPECS: ${{ matrix.files }}

      # Round 90 (step E0): the slowest spec files and tests of the part, so the next limit review and the next cut read numbers
      # from the log. The aggregate job prints the same over all three parts. The JSON report is kept on every run (green too).
      - name: List the slowest browser specs and tests
        if: always()
        run: test -f playwright-report.json && node scripts/merge-playwright-reports.mjs playwright-report.json || true

      - name: Keep the JSON report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-part-${{ matrix.part }}
          path: playwright-report.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Keep the failure traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-part-${{ matrix.part }}
          path: test-results
          retention-days: 7

  # The required check. It needs the three parts, passes only when the matrix result is "success" (a failed, cancelled or skipped
  # part gives another result), and prints the wall time of each part and the slowest files and tests over all of them.
  browser-flows:
    name: Browser flows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: browser
    if: always()
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Fetch the reports of the three parts
        uses: actions/download-artifact@v4
        if: always()
        with:
          pattern: playwright-report-part-*
          path: part-reports

      - name: Merge the reports and list the wall time of each part and the slowest specs and tests
        if: always()
        run: |
          shopt -s nullglob
          reports=(part-reports/playwright-report-part-*/playwright-report.json)
          echo "${#reports[@]} of 3 part reports found"
          if [ "${#reports[@]}" -gt 0 ]; then node scripts/merge-playwright-reports.mjs --out playwright-report.json "${reports[@]}"; fi

      - name: Keep the merged JSON report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail unless all three parts passed
        env:
          PARTS: ${{ needs.browser.result }}
        run: |
          echo "The parts' result: $PARTS"
          test "$PARTS" = success

  build:
    name: Production build smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Round 90 (#173): the unused-code report and the lint rules run in a required check, so a merge needs both empty.
      - name: Check for unused code
        run: npm run knip

      - name: Lint
        run: npm run lint

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Round 89 (step M4): the packed packages install and run in a throwaway consumer project; a pack that
      # breaks (an import without its extension, a missing export) fails this job. It takes under a minute.
      - name: Pack the packages and run the consumer smoke
        run: npm run pack:smoke

      # The minified bundle with the speed layer off and on: same analysis, every worker reports active.
      - name: Run the build smoke
        run: npm run test:build

name: Feedback

# Security as bank.yml: only a push to feedback/** starts it; read-only token, .feedback-run.json is untrusted input.
# Pinned to ubuntu-24.04 and Node 24.21.0 like bank.yml; workflows.spec.ts pins these properties.

on:
  push:
    branches: ['feedback/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feedback-${{ github.ref }}
  cancel-in-progress: false

jobs:
  config:
    name: Read the run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runs: ${{ steps.config.outputs.runs }}
      name: ${{ steps.config.outputs.name }}
    steps:
      - name: Check out the run commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0

      - name: Validate .feedback-run.json
        id: config
        run: node scripts/feedback-run-config.mjs check

  feedback:
    name: Run ${{ matrix.index }}
    needs: config
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        index: ${{ fromJSON(needs.config.outputs.runs) }}
    steps:
      - name: Check out the run commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Show the runner
        run: nproc && free -m

      - name: Run the feedback corpus
        shell: bash
        run: mkdir -p docs/reports && npm run test:feedback 2>&1 | tee docs/reports/feedback.log
        env:
          FEEDBACK_DUMP: '1'

      - name: Keep the run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feedback-run-${{ matrix.index }}
          path: docs/reports
          retention-days: 7
          if-no-files-found: error

  compare:
    name: Compare the runs
    needs: [config, feedback]
    if: ${{ always() && needs.config.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the run commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0

      - name: Fetch the runs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: feedback-run-*
          path: .feedback/runs

      - name: Compare the dumps byte for byte
        run: node scripts/feedback-run-config.mjs compare .feedback/runs

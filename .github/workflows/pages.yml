name: Deploy GitHub Pages

on:
  # The nightly of master deploys only after the Tests workflow passed on that very commit.
  workflow_run:
    workflows:
      - Tests
    types:
      - completed
    branches:
      - master
      - main
  # A release made by hand redeploys the site; release.yml dispatches this workflow for the release it makes.
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    # A data release of the bank carries no build and may not deploy to github-pages.
    if: ${{ (github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'bank-data-')) && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # A workflow_run event carries the newest commit of master; the build takes the one the tests passed on.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # The nightly sits at the root; every release keeps a frozen copy under its tag, rebuilt from its zip.
      - name: Assemble nightly and release channels
        env:
          GH_TOKEN: ${{ github.token }}
          # The hand-updated production deployment, linked from /versions/; nothing here writes to it.
          PS_PRODUCTION_URL: https://fulllifegames.com/Tools/PSDashboard/
        run: |
          mkdir -p site
          cp -r dist/. site/
          rm -rf .versions-tmp && mkdir -p .versions-tmp
          kept=0
          while IFS=$'\t' read -r tag published; do
            if [ "$kept" -ge 10 ]; then break; fi
            if ! gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
                 --pattern 'ps-dashboard-*.zip' \
                 --dir .versions-tmp --clobber >/dev/null 2>&1; then
              echo "No build asset on $tag - skipping."
              continue
            fi
            mkdir -p "site/$tag"
            unzip -q -o .versions-tmp/ps-dashboard-*.zip -d "site/$tag"
            # The newest release carrying a build is also served at /latest/,
            # so there is a stable address that never names a version.
            if [ "$kept" -eq 0 ]; then
              mkdir -p site/latest
              cp -r "site/$tag/." site/latest/
            fi
            rm -f .versions-tmp/*.zip
            printf '%s\t%s\n' "$tag" "$published" >> .versions-tmp/manifest.tsv
            kept=$((kept + 1))
          done < <(gh release list --repo "$GITHUB_REPOSITORY" \
                     --limit 40 --exclude-drafts \
                     --json tagName,publishedAt \
                     --jq '.[] | [.tagName, .publishedAt] | @tsv')
          node scripts/build-versions-index.mjs site .versions-tmp/manifest.tsv \
            "$GITHUB_REPOSITORY" "$(git rev-parse --short HEAD)" "$(date -u +%F)"
          echo "Assembled the nightly plus $kept frozen build(s)."

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

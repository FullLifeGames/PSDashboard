name: Release

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version and look for its tag
        id: version
        run: |
          version="$(jq -r .version package.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged - nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version has no tag yet - cutting a release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package dist
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          cd dist
          zip -r "../ps-dashboard-$VERSION.zip" .

      - name: Create release
        env:
          VERSION: ${{ needs.check.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Default Pages address for this repo — the owner segment is
          # lower-cased, the repo segment keeps its case.
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY##*/}"
          site="https://$(echo "$owner" | tr '[:upper:]' '[:lower:]').github.io/$repo"
          # gh prepends --notes to the generated changelog, so these links head
          # the release body. The frozen copy appears once the Pages run that
          # this release triggers finishes.
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --target "$GITHUB_SHA" \
            --notes "**[Open this build]($site/v$VERSION/)** · [Production](https://fulllifegames.com/Tools/PSDashboard/) · [All hosted versions]($site/versions/) · [Nightly]($site/)" \
            --generate-notes \
            "ps-dashboard-$VERSION.zip"
